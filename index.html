<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURIX AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
}

.logo{
    width:105px;
    height:105px;
    border:2px solid #d4af37;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
    box-shadow:
        0 0 20px rgba(212,175,55,.25),
        inset 0 0 20px rgba(212,175,55,.08);
}

.logo span{
    font-size:43px;
    font-weight:800;
    color:#d4af37;
    letter-spacing:-3px;
}

h1{
    font-size:38px;
    letter-spacing:6px;
    color:#d4af37;
    margin-bottom:12px;
}

.subtitle{
    color:#aaa;
    font-size:14px;
    letter-spacing:2px;
    margin-bottom:45px;
}

.line{
    width:90px;
    height:1px;
    background:#d4af37;
    margin-bottom:45px;
}

.status{
    color:#777;
    font-size:12px;
    letter-spacing:1px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>A</span>
    </div>

    <h1>AURIX AI</h1>

    <div class="subtitle">
        GOLD MARKET INTELLIGENCE
    </div>

    <div class="line"></div>

    <div class="status">
        AI-POWERED GOLD SIGNALS
    </div>

</div>

</body>
</html>
